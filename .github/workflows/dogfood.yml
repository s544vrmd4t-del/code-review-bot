name: 🤖 Dogfood — 自用代码审查

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./  # 自引用，用本地 action
        with:
          api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          model: deepseek-chat
          language: zh-CN
